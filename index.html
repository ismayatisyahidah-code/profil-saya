<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya</title>
    <!-- Import Font Lucu/Estetik dari Google Fonts (Quicksand) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: #f7f4ef; /* Latar Belakang Warm Cream */
            color: #4a3b32; /* Teks Warm Brown */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Banner Atas */
        .header-banner {
            width: 100%;
            background-color: #d8a48f; /* Muted Terracotta */
            padding: 40px 20px 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .header-banner h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Running / Welcome Bar */
        .welcome-bar {
            width: 100%;
            background-color: #b5836d; /* Deep Warm Earth */
            color: #fff8f0;
            text-align: center;
            padding: 8px 20px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* Container Card Utama (Dilebarkan agar email muat 1 baris) */
        .profile-card {
            background-color: #ffffff;
            width: 92%;
            max-width: 500px; /* Lebar diperbesar dari 450px ke 500px */
            margin: 35px auto;
            padding: 30px 25px;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(115, 87, 72, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #e2d9cd;
        }

        /* Foto Profil Melingkar */
        .profile-img-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #a3b18a; /* Soft Sage Green Accent */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            display: block;
        }

        /* Tag Sub-Judul */
        .badge {
            background-color: #e9edc9;
            color: #588157;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        /* Kartu Biodata */
        .info-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .info-table tr {
            background-color: #fcfbf9;
            border-radius: 12px;
        }

        .info-table td {
            padding: 10px 14px;
            font-size: 0.85rem; /* Font diperkecil sedikit agar pas */
            vertical-align: middle;
        }

        .info-table td.label {
            font-weight: 700;
            color: #8c5e47;
            width: 30%; /* Lebar kolom label disesuaikan */
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            background-color: #f3ece3;
            white-space: nowrap;
        }

        .info-table td.value {
            font-weight: 600;
            color: #4a3b32;
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            background-color: #faf7f2;
            white-space: nowrap; /* Mencegah teks turun ke baris baru */
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="header-banner">
        <h1>Profil Saya</h1>
    </div>

    <!-- Running/Welcome Bar -->
    <div class="welcome-bar">
        ✨ Selamat Datang di Halaman Profilku ✨
    </div>

    <!-- Main Profile Card -->
    <div class="profile-card">
        <!-- Foto Profil -->
        <div class="profile-img-wrapper">
            <img src="foto-isma (2).jpeg" alt="Foto Profil" class="profile-img">
        </div>

        <div class="badge">Student Profile</div>

        <!-- Tabel Informasi -->
        <table class="info-table">
            <tr>
                <td class="label">Nama</td>
                <td class="value">Ismayati Syahidah</td>
            </tr>
            <tr>
                <td class="label">Jurusan</td>
                <td class="value">Informatika</td>
            </tr>
            <tr>
                <td class="label">Alamat</td>
                <td class="value">Jalan Mekar Indah</td>
            </tr>
            <tr>
                <td class="label">Asal Kota</td>
                <td class="value">Bandung</td>
            </tr>
            <tr>
                <td class="label">Email</td>
                <td class="value">ismayati.syahidah@mhs.itenas.id</td>
            </tr>
        </table>
    </div>

</body>
</html>
